name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and unit/E2E tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      # Implementation-specific tests skip here; the implementation job runs them against real builds.
      - run: uv run pytest

  discover:
    name: Discover implementations
    runs-on: ubuntu-24.04
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          names=$(find implementations -mindepth 2 -maxdepth 2 -name build.sh -printf '%h\n' \
            | xargs -r -n1 basename | sort | jq -R . | jq -cs .)
          echo "names=${names:-[]}" >> "$GITHUB_OUTPUT"

  implementation:
    name: Build and test ${{ matrix.name }}
    needs: discover
    if: needs.discover.outputs.names != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.discover.outputs.names) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - uses: actions/cache@v6
        with:
          path: .build/${{ matrix.name }}
          # Exact hit needs unchanged adapter sources; the prefix restores the library build.
          key: build-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles(format('implementations/{0}/build.sh', matrix.name), format('implementations/{0}/*.patch', matrix.name)) }}-${{ hashFiles(format('implementations/{0}/**', matrix.name)) }}
          restore-keys: |
            build-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles(format('implementations/{0}/build.sh', matrix.name), format('implementations/{0}/*.patch', matrix.name)) }}-
      - name: Install system packages
        run: |
          f=implementations/${{ matrix.name }}/apt-packages.txt
          if [ -f "$f" ]; then sudo apt-get update -q && xargs -a "$f" sudo apt-get install -y -q --no-install-recommends; fi
      - name: Build
        run: implementations/${{ matrix.name }}/build.sh
      - name: Adapter tests
        env:
          DTLS_INTEROP_REQUIRE: ${{ matrix.name }}
        run: uv run pytest tests/impl/test_${{ matrix.name }}.py
      - name: Conformance suite
        env:
          DTLS_INTEROP_REQUIRE: ${{ matrix.name }}
        run: uv run pytest tests/conformance

  matrix-e2e:
    name: Matrix E2E (openssl, wolfssl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - uses: actions/cache@v6
        with:
          path: .build/openssl
          key: build-openssl-${{ runner.os }}-${{ hashFiles('implementations/openssl/build.sh', 'implementations/openssl/*.patch') }}-${{ hashFiles('implementations/openssl/**') }}
          restore-keys: |
            build-openssl-${{ runner.os }}-${{ hashFiles('implementations/openssl/build.sh', 'implementations/openssl/*.patch') }}-
      - uses: actions/cache@v6
        with:
          path: .build/wolfssl
          key: build-wolfssl-${{ runner.os }}-${{ hashFiles('implementations/wolfssl/build.sh', 'implementations/wolfssl/*.patch') }}-${{ hashFiles('implementations/wolfssl/**') }}
          restore-keys: |
            build-wolfssl-${{ runner.os }}-${{ hashFiles('implementations/wolfssl/build.sh', 'implementations/wolfssl/*.patch') }}-
      - run: implementations/openssl/build.sh
      - run: implementations/wolfssl/build.sh
      - name: CLI, runner and proxy against the real builds
        env:
          DTLS_INTEROP_REQUIRE: openssl,wolfssl
        run: uv run pytest tests/e2e
